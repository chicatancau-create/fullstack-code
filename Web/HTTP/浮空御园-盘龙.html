<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>浮空御园 · 盘龙 — 立方体东方仙境</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --ink:#f3ead8; --dim:#b9a888; --gold:#d9a441; --gold-hi:#f2c14e;
    --verm:#c0392b; --jade:#12b26b; --panel:rgba(16,14,10,.78);
    --line:rgba(217,164,65,.28); --track:rgba(217,164,65,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0e13;color:var(--ink);
    font:400 13px/1.55 "Noto Serif SC","Songti SC","STSong","SimSun",serif;
    -webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:grab}
  canvas.dragging{cursor:grabbing}

  /* 镜头暗角 */
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(ellipse at 50% 46%,transparent 46%,rgba(6,7,11,.34) 78%,rgba(4,5,9,.72) 100%)}
  #topfade{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:linear-gradient(180deg,rgba(8,9,13,.28),transparent 18%,transparent 84%,rgba(8,9,13,.30))}

  .brand{position:fixed;left:26px;top:22px;z-index:5;pointer-events:none;user-select:none}
  .brand h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.22em;color:var(--ink);
    text-shadow:0 2px 14px rgba(0,0,0,.65)}
  .brand h1 em{font-style:normal;color:var(--gold-hi)}
  .brand p{margin:6px 0 0;font-size:11px;letter-spacing:.34em;color:var(--dim)}
  .brand .seal{display:inline-block;margin-top:10px;padding:3px 7px;font-size:11px;letter-spacing:.2em;
    color:#f6e3c8;background:var(--verm);border-radius:3px;box-shadow:0 2px 10px rgba(192,57,43,.45)}

  #hint{position:fixed;left:26px;bottom:20px;z-index:5;pointer-events:none;user-select:none;
    font-size:11px;letter-spacing:.14em;color:var(--dim);text-shadow:0 1px 8px rgba(0,0,0,.7)}
  #hint b{color:var(--ink);font-weight:600}

  /* 调控面板 */
  #panel{position:fixed;right:16px;top:16px;bottom:16px;width:248px;z-index:6;
    display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    backdrop-filter:blur(12px) saturate(1.15);box-shadow:0 22px 60px rgba(0,0,0,.55);
    overflow:hidden}
  #panel header{padding:13px 16px 10px;border-bottom:1px solid var(--line);flex:none}
  #panel header h2{margin:0;font-size:14px;letter-spacing:.3em;color:var(--gold-hi);font-weight:700}
  #panel header small{display:block;margin-top:3px;font-size:10px;letter-spacing:.18em;color:var(--dim)}
  #panel .body{flex:1;overflow-y:auto;padding:12px 16px 8px}
  #panel .body::-webkit-scrollbar{width:8px}
  #panel .body::-webkit-scrollbar-track{background:rgba(217,164,65,.07);border-radius:4px}
  #panel .body::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--gold),#8a6420);border-radius:4px}
  #panel .body::-webkit-scrollbar-thumb:hover{background:var(--gold-hi)}
  #panel .body{scrollbar-width:thin;scrollbar-color:var(--gold) rgba(217,164,65,.07)}

  .ctl{margin-bottom:12px}
  .ctl .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .ctl .lab span{font-size:11.5px;letter-spacing:.12em;color:var(--ink)}
  .ctl .lab output{font-size:11px;color:var(--gold-hi);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:none;cursor:ew-resize;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;
    background:linear-gradient(90deg,var(--verm),var(--gold) 55%,var(--jade))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5px;
    border-radius:50%;background:var(--gold-hi);border:1px solid #6b4d12;
    box-shadow:0 0 0 3px rgba(242,193,78,.18),0 2px 6px rgba(0,0,0,.55)}
  input[type=range]::-moz-range-track{height:3px;border-radius:2px;
    background:linear-gradient(90deg,var(--verm),var(--gold) 55%,var(--jade))}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--gold-hi);
    border:1px solid #6b4d12;box-shadow:0 0 0 3px rgba(242,193,78,.18)}

  .switchrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
  .switchrow span{font-size:11.5px;letter-spacing:.12em}
  .switch{position:relative;width:36px;height:19px;flex:none;cursor:pointer}
  .switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
  .switch i{position:absolute;inset:0;border-radius:10px;background:rgba(217,164,65,.16);
    border:1px solid var(--line);transition:background .2s}
  .switch i::after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;
    background:var(--dim);transition:transform .2s,background .2s}
  .switch input:checked + i{background:rgba(18,178,107,.4)}
  .switch input:checked + i::after{transform:translateX(17px);background:var(--gold-hi)}

  select{width:100%;padding:5px 8px;font:inherit;font-size:11.5px;color:var(--ink);
    background:rgba(217,164,65,.1);border:1px solid var(--line);border-radius:6px;cursor:pointer}
  select option{background:#171310;color:var(--ink)}

  #panel footer{flex:none;padding:11px 16px 13px;border-top:1px solid var(--line)}
  .btns{display:flex;gap:7px}
  .btns button{flex:1;padding:7px 0;font:inherit;font-size:11.5px;letter-spacing:.14em;cursor:pointer;
    color:var(--ink);background:rgba(217,164,65,.12);border:1px solid var(--line);border-radius:7px;
    transition:background .15s,transform .1s}
  .btns button:hover{background:rgba(217,164,65,.3)}
  .btns button:active{transform:scale(.96)}
  .btns button.primary{background:linear-gradient(135deg,#a33a24,#c0392b);border-color:#e06a4a;color:#ffe9d2}
  .btns button.primary:hover{background:linear-gradient(135deg,#c0392b,#d9503c)}
  #stats{margin-top:9px;font-size:10px;letter-spacing:.12em;color:var(--dim);display:flex;justify-content:space-between}
  #stats b{color:var(--gold-hi);font-weight:600}

  /* 加载与错误 */
  #loading{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;gap:18px;
    align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#1a2030,#0b0e13 75%);
    transition:opacity .7s}
  #loading.gone{opacity:0;pointer-events:none}
  #loading h1{margin:0;font-size:34px;letter-spacing:.4em;color:var(--gold-hi);font-weight:700;text-indent:.4em}
  #loading p{margin:0;font-size:12px;letter-spacing:.3em;color:var(--dim)}
  .spinner{width:44px;height:44px;border-radius:50%;border:2px solid rgba(217,164,65,.18);
    border-top-color:var(--gold-hi);animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #fatal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    background:#0b0e13;color:var(--dim);font-size:13px;letter-spacing:.1em;text-align:center;padding:30px}

  @media (max-width:760px){
    .brand{left:12px;top:10px;max-width:170px}
    .brand h1{font-size:15px;letter-spacing:.1em}
    .brand p{font-size:8px;letter-spacing:.1em;margin-top:3px}
    .brand .seal{margin-top:6px;font-size:9px;padding:2px 5px}
    #hint{display:none}
    #panel{right:8px;top:8px;bottom:8px;width:196px}
    #panel .body{padding:10px 12px 6px}
    #panel header{padding:10px 12px 8px}
    #panel footer{padding:9px 12px 11px}
    .btns{flex-wrap:wrap}
    .btns button{flex:1 1 40%}
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="topfade"></div>
<div id="vignette"></div>

<div class="brand">
  <h1>浮空御园 <em>·</em> 盘龙</h1>
  <p>立方体东方仙境 · VOXEL CELESTIAL GARDEN</p>
  <span class="seal">御 制</span>
</div>

<div id="hint"><b>左键拖拽</b> 环绕 &nbsp;·&nbsp; <b>滚轮</b> 缩放 &nbsp;·&nbsp; <b>右键拖拽</b> 平移 &nbsp;·&nbsp; 触屏单指旋转 / 双指缩放</div>

<aside id="panel">
  <header>
    <h2>造园司 · 调控</h2>
    <small>拨动即生效 · 实时渲染</small>
  </header>
  <div class="body">
    <div class="ctl"><div class="lab"><span>龙游速度</span><output id="o-dragon">0.70</output></div>
      <input type="range" id="c-dragon" min="0" max="2" step="0.01" value="0.7"></div>
    <div class="ctl"><div class="lab"><span>花瓣数量</span><output id="o-petals">220</output></div>
      <input type="range" id="c-petals" min="0" max="400" step="10" value="220"></div>
    <div class="ctl"><div class="lab"><span>日光方位</span><output id="o-sunaz">35°</output></div>
      <input type="range" id="c-sunaz" min="0" max="360" step="1" value="35"></div>
    <div class="ctl"><div class="lab"><span>日光强度</span><output id="o-sunint">2.6</output></div>
      <input type="range" id="c-sunint" min="0.5" max="5" step="0.1" value="2.6"></div>
    <div class="ctl"><div class="lab"><span>灯笼辉光</span><output id="o-glow">1.00</output></div>
      <input type="range" id="c-glow" min="0" max="2" step="0.01" value="1"></div>
    <div class="ctl"><div class="lab"><span>雾霭浓度</span><output id="o-fog">0.0028</output></div>
      <input type="range" id="c-fog" min="0" max="0.008" step="0.0002" value="0.0028"></div>
    <div class="ctl"><div class="lab"><span>镜头暗角</span><output id="o-vig">0.55</output></div>
      <input type="range" id="c-vig" min="0" max="1" step="0.01" value="0.55"></div>
    <div class="ctl"><div class="lab"><span>渲染画质</span></div>
      <select id="c-quality">
        <option value="0.75">流畅 · 0.75×</option>
        <option value="1.25" selected>均衡 · 1.25×</option>
        <option value="2">高清 · 2×</option>
      </select></div>
    <div class="switchrow"><span>自动环绕</span>
      <label class="switch"><input type="checkbox" id="c-auto" checked><i></i></label></div>
    <div class="switchrow"><span>实时阴影</span>
      <label class="switch"><input type="checkbox" id="c-shadow" checked><i></i></label></div>
  </div>
  <footer>
    <div class="btns">
      <button id="b-reset" class="primary">重置</button>
      <button id="b-random">随机气韵</button>
      <button id="b-shot">截图留存</button>
    </div>
    <div id="stats"><span>方块 <b id="st-vox">—</b></span><span><b id="st-fps">—</b> FPS</span></div>
  </footer>
</aside>

<div id="loading">
  <h1>浮空御园</h1>
  <div class="spinner"></div>
  <p>叠石为山 · 聚块成园</p>
</div>
<div id="fatal"></div>

<script type="module">
/* ============ Three.js CDN 多级回退 ============ */
const CDNS = [
  'https://fastly.jsdelivr.net/npm/three@0.169.0/build/three.module.js',
  'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js',
  'https://registry.npmmirror.com/three/0.169.0/files/build/three.module.js',
  'https://unpkg.com/three@0.169.0/build/three.module.js'
];
let THREE = null;
for (const u of CDNS) { try { THREE = await import(u); break; } catch (e) {} }
const fatal = (msg) => {
  const f = document.getElementById('fatal');
  f.style.display = 'flex'; f.textContent = msg;
  document.getElementById('loading').classList.add('gone');
};
if (!THREE) { fatal('无法从 CDN 加载 Three.js，请检查网络后刷新。'); throw new Error('three load failed'); }

/* ============ 基础工具 ============ */
let seed = 20261116;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + rnd() * (b - a);
const pick = arr => arr[Math.floor(rnd() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hash2 = (x, z) => { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); };

const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(),
      _p = new THREE.Vector3(), _s = new THREE.Vector3(), _c = new THREE.Color(),
      _up = new THREE.Vector3(0, 1, 0), _tan = new THREE.Vector3(), _look = new THREE.Matrix4();

/* 静态体素收集器：不同物件用不同尺度单元 */
const SV = [], EV = [], glowPoints = [];
function vox(x, y, z, sx, sy, sz, c, ry = 0, rx = 0, rz = 0) {
  SV.push({ x, y, z, sx, sy, sz, c, ry, rx, rz });
}
function evox(x, y, z, sx, sy, sz) { EV.push({ x, y, z, sx, sy, sz }); }
function jitterColor(hex, amt = 0.045) {
  _c.setHex(hex); const hsl = {}; _c.getHSL(hsl);
  hsl.l = clamp(hsl.l + (rnd() - 0.5) * amt, 0.02, 0.96);
  hsl.s = clamp(hsl.s + (rnd() - 0.5) * 0.05, 0, 1);
  _c.setHSL(hsl.h, hsl.s, hsl.l); return _c.clone();
}
function bakeVoxels(list, mat, shadow = true) {
  const mesh = new THREE.InstancedMesh(boxGeo, mat, list.length);
  list.forEach((v, i) => {
    _e.set(v.rx || 0, v.ry || 0, v.rz || 0); _q.setFromEuler(_e);
    _p.set(v.x, v.y, v.z); _s.set(v.sx, v.sy, v.sz);
    _m.compose(_p, _q, _s); mesh.setMatrixAt(i, _m);
    mesh.setColorAt(i, jitterColor(v.c));
  });
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.castShadow = shadow; mesh.receiveShadow = shadow;
  mesh.frustumCulled = false;
  return mesh;
}

/* ============ 渲染器 / 场景 / 相机 ============ */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) { fatal('当前环境不支持 WebGL。'); throw e; }
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('stage').appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xc9d2dc, 0.0028);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 900);

/* 天空穹顶：暮色渐变 + 日晕，无云 */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    zenith: { value: new THREE.Color(0x27446f) },
    mid: { value: new THREE.Color(0x84a6cf) },
    horizon: { value: new THREE.Color(0xe8c193) },
    abyss: { value: new THREE.Color(0x2b3440) },
    sunDir: { value: new THREE.Vector3(0.5, 0.6, 0.3).normalize() },
    sunCol: { value: new THREE.Color(0xffd9a0) }
  },
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `varying vec3 vP; uniform vec3 zenith,mid,horizon,abyss,sunDir,sunCol;
    void main(){
      vec3 d = normalize(vP);
      float h = clamp(d.y, -1.0, 1.0);
      vec3 col = mix(horizon, mid, smoothstep(-0.02, 0.24, h));
      col = mix(col, zenith, smoothstep(0.22, 0.72, h));
      col = mix(col, abyss, smoothstep(0.02, 0.6, -h));
      float s = max(dot(d, normalize(sunDir)), 0.0);
      col += sunCol * (pow(s, 90.0) * 0.9 + pow(s, 7.0) * 0.16);
      gl_FragColor = vec4(col, 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), skyMat));

/* 光照：暖阳主光 + 天光补光 */
const hemi = new THREE.HemisphereLight(0xbdd4f0, 0x3e4a33, 0.75);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffd9a8, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -52; sun.shadow.camera.right = 52;
sun.shadow.camera.top = 52; sun.shadow.camera.bottom = -52;
sun.shadow.camera.near = 5; sun.shadow.camera.far = 200;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.5;
scene.add(sun); scene.add(sun.target);
function setSun(azDeg, intensity) {
  const a = azDeg * Math.PI / 180;
  sun.position.set(Math.cos(a) * 58, 44, Math.sin(a) * 58);
  sun.intensity = intensity;
  skyMat.uniforms.sunDir.value.copy(sun.position).normalize();
}
setSun(35, 2.6);

/* ============ 地形：主岛高度场（池塘/小溪下凹） ============ */
const U = 2;
const pondC = { x: 9, z: 9 };
function pondSigned(x, z) {
  const dx = x - pondC.x, dz = z - pondC.z;
  const ang = Math.atan2(dz, dx);
  const rp = 6.2 + 1.1 * Math.sin(ang * 3 + 0.8) + 0.5 * Math.sin(ang * 5 + 2);
  return Math.hypot(dx, dz) - rp;
}
const streamPts = [[12.5, 10.2], [16.5, 11.2], [20.5, 12.2], [25.5, 13.0]];
function segDist(px, pz, a, b) {
  const abx = b[0] - a[0], abz = b[1] - a[1];
  const t = clamp(((px - a[0]) * abx + (pz - a[1]) * abz) / (abx * abx + abz * abz), 0, 1);
  return Math.hypot(px - (a[0] + abx * t), pz - (a[1] + abz * t));
}
function streamDist(x, z) {
  let d = 1e9;
  for (let i = 0; i < streamPts.length - 1; i++) d = Math.min(d, segDist(x, z, streamPts[i], streamPts[i + 1]));
  return d;
}
const pathPts = [[0.5, 25.5], [0.5, 17], [-1.5, 11], [-4, 5], [-6.5, 0], [-8, -3.5]];
function pathDist(x, z) {
  let d = 1e9;
  for (let i = 0; i < pathPts.length - 1; i++) d = Math.min(d, segDist(x, z, pathPts[i], pathPts[i + 1]));
  return d;
}
function islandR(x, z) { return 24.6 + hash2(Math.round(x / U), Math.round(z / U)) * 2.2; }
function cellH(x, z) {
  if (pondSigned(x, z) < 0) return -2.6;
  if (streamDist(x, z) < 1.8) return -1.7;
  return 0;
}
const cells = [];
for (let gx = -13; gx <= 13; gx++) for (let gz = -13; gz <= 13; gz++) {
  const x = gx * U, z = gz * U;
  if (Math.hypot(x, z) > islandR(x, z) && streamDist(x, z) > 2.4) continue;
  cells.push({ x, z, h: cellH(x, z), path: cellH(x, z) === 0 && pathDist(x, z) < 1.5 });
}
const cellAt = new Map(cells.map(c => [c.x + ',' + c.z, c]));
const GRASS = [0x4f9e3f, 0x57ab46, 0x4a9440, 0x61b34e];
const DIRT = [0x7a5230, 0x6b4526, 0x8a6038];
const ROCK = [0x5d5a55, 0x6e675e, 0x4c4a46];
for (const c of cells) {
  let top;
  if (c.h < -2) top = 0x1d5f66;
  else if (c.h < 0) top = 0x20646b;
  else if (c.path) top = 0xcfc4a8;
  else top = pick(GRASS);
  vox(c.x, c.h - 1, c.z, U, U, U, top);
  for (let y = c.h - 3; y >= -5; y -= U) vox(c.x, y, c.z, U, U, U, pick(DIRT));
}
/* 岛底岩层倒锥 */
for (let L = 1; L <= 6; L++) {
  const y = -5 - L * U, rad = 25.5 - L * 3.4;
  for (let gx = -13; gx <= 13; gx++) for (let gz = -13; gz <= 13; gz++) {
    const x = gx * U, z = gz * U;
    if (Math.hypot(x, z) > rad + hash2(gx + L * 7, gz - L * 3) * 2.4 - 1.2) continue;
    vox(x, y, z, U, U, U, rnd() < 0.03 ? 0xc9a227 : pick(ROCK));
  }
}
for (let i = 0; i < 9; i++) {
  const a = rr(0, Math.PI * 2), r = rr(8, 20);

  const tail = new THREE.Mesh(boxGeo, m2); tail.scale.set(0.3, 0.22, 0.42); tail.position.z = -0.52;
  const fin = new THREE.Mesh(boxGeo, m2); fin.scale.set(0.56, 0.06, 0.24); fin.position.set(0, -0.1, 0.1);
  g.add(head, body, tail, fin);
  g.traverse(o => { if (o.isMesh) { o.castShadow = false; } });
  scene.add(g);
  kois.push({ g, tail, r: 2 + (i % 3) * 1.35, sp: rr(0.25, 0.5) * (i % 2 ? 1 : -1), ph: rr(0, 9), y: rr(-1.6, -1.0) });
}
function updateKoi(t) {
  for (const k of kois) {
    const a = t * k.sp + k.ph;
    const x = 9 + Math.cos(a) * k.r, z = 9 + Math.sin(a) * k.r;
    k.g.position.set(x, k.y + Math.sin(t * 0.8 + k.ph) * 0.18, z);
    const vx = -Math.sin(a) * k.sp, vz = Math.cos(a) * k.sp;
    k.g.rotation.y = Math.atan2(vx, vz);
    k.tail.rotation.y = Math.sin(t * 6 + k.ph) * 0.45;
    k.g.rotation.z = Math.sin(t * 2 + k.ph) * 0.06;
  }
}

/* ============ 蝴蝶（细单元） ============ */
const butterflies = [];
const wingGeo = new THREE.BoxGeometry(0.3, 0.02, 0.22); wingGeo.translate(0.16, 0, 0);
const bflyCols = [0x22d3ee, 0xf06595, 0xffc078, 0xb197fc, 0x69db7c, 0xff8787, 0x74c0fc, 0xf783ac];
const bflyCenters = beds.map(b => [b[0], b[1]]).concat([[-15, 5], [15, -6]]);
for (let i = 0; i < 8; i++) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: bflyCols[i], roughness: 0.5, side: THREE.DoubleSide });
  const bodyM = new THREE.Mesh(boxGeo, new THREE.MeshStandardMaterial({ color: 0x2b2b2b }));
  bodyM.scale.set(0.07, 0.07, 0.3);
  const wl = new THREE.Mesh(wingGeo, mat), wr = new THREE.Mesh(wingGeo, mat);
  wr.scale.x = -1;
  g.add(bodyM, wl, wr); scene.add(g);
  const c = bflyCenters[i % bflyCenters.length];
  butterflies.push({ g, wl, wr, cx: c[0], cz: c[1], ph: rr(0, 9), sp: rr(0.5, 1), r: rr(1.4, 2.6) });
}
function updateButterflies(t) {
  for (const b of butterflies) {
    const a = t * b.sp + b.ph;
    const x = b.cx + Math.cos(a) * b.r + Math.sin(a * 2.3) * 0.5;
    const z = b.cz + Math.sin(a * 0.9) * b.r;
    const y = 1.3 + Math.sin(a * 1.7) * 0.55 + Math.sin(t * 3 + b.ph) * 0.12;
    b.g.position.set(x, y, z);
    b.g.rotation.y = Math.atan2(-Math.sin(a) * b.sp, Math.cos(a * 0.9) * b.sp * 0.9);
    const flap = Math.sin(t * 18 + b.ph) * 0.75 + 0.25;
    b.wl.rotation.z = flap; b.wr.rotation.z = -flap;
  }
}

/* ============ 仙鹤：展翅 ============ */
function craneModel() {
  const g = new THREE.Group();
  const CV = [];
  const cv = (x, y, z, sx, sy, sz, c) => CV.push({ x, y, z, sx, sy, sz, c });
  const WH = 0xf8f6f0, BK = 0x22262b;
  cv(0, 0, 0, 0.9, 0.7, 1.5, WH);
  cv(0, 0.15, -0.8, 0.7, 0.5, 0.6, BK);
  cv(0, 0.35, 0.7, 0.3, 0.5, 0.3, WH);
  cv(0, 0.75, 0.95, 0.24, 0.5, 0.24, WH);
  cv(0, 1.15, 1.1, 0.22, 0.45, 0.22, WH);
  cv(0, 1.5, 1.2, 0.3, 0.3, 0.4, WH);
  cv(0, 1.68, 1.22, 0.16, 0.12, 0.2, 0xe03131);
  cv(0, 1.47, 1.55, 0.12, 0.1, 0.55, 0x4a4f55);
  cv(-0.28, -0.75, 0.1, 0.09, 1.0, 0.09, BK);
  cv(0.28, -0.75, -0.1, 0.09, 1.0, 0.09, BK);
  g.add(bakeVoxels(CV, stdMat));
  const wings = [];
  for (const s of [-1, 1]) {
    const wg = new THREE.Group(); wg.position.set(s * 0.42, 0.28, 0);
    const WV = [];
    for (let k = 0; k < 5; k++) {
      WV.push({ x: s * (0.35 + k * 0.42), y: k * 0.06, z: -k * 0.06, sx: 0.46, sy: 0.12, sz: 0.9 - k * 0.1, c: k >= 3 ? BK : WH });
    }
    wg.add(bakeVoxels(WV, stdMat));
    g.add(wg); wings.push(wg);
  }
  return { g, wings };
}
const craneStand = craneModel();
craneStand.g.position.set(6, 1.44, 16.5);
craneStand.g.scale.setScalar(1.15);
craneStand.g.rotation.y = Math.atan2(9 - 6, 9 - 16.5);
scene.add(craneStand.g);
const craneFly = craneModel();
scene.add(craneFly.g);
function updateCranes(t) {
  const flap = Math.sin(t * 1.2) * 0.1;
  craneStand.wings[0].rotation.z = 0.5 + flap;
  craneStand.wings[1].rotation.z = -0.5 - flap;
  const a = -t * 0.1 + 2;
  craneFly.g.position.set(Math.cos(a) * 31, 21 + Math.sin(t * 0.5) * 1.2, Math.sin(a) * 31);
  craneFly.g.rotation.y = Math.atan2(Math.sin(a), -Math.cos(a));
  const f2 = Math.sin(t * 6) * 0.5;
  craneFly.g.rotation.z = 0.12;
  craneFly.wings[0].rotation.z = 0.35 + f2;
  craneFly.wings[1].rotation.z = -0.35 - f2;
}

/* ============ 相机控制：阻尼环绕 / 缩放 / 平移 ============ */
const INIT = { theta: 0.65, phi: 1.12, dist: 62, tx: 0, ty: 5, tz: 0 };
const goal = { ...INIT }, cur = { ...INIT };
let autoRotate = true, dragging = false;
const pointers = new Map();
let pinchD = 0;
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, b: e.button, shift: e.shiftKey });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchD = Math.hypot(a.x - b.x, a.y - b.y);
  }
  dragging = true; canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1) {
    if (p.b === 2 || p.shift) pan(dx, dy);
    else { goal.theta -= dx * 0.005; goal.phi = clamp(goal.phi - dy * 0.005, 0.12, 2.15); }
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchD > 0) goal.dist = clamp(goal.dist * pinchD / d, 14, 160);
    pinchD = d;
    pan(dx * 0.5, dy * 0.5);
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchD = 0;
  if (pointers.size === 0) { dragging = false; canvas.classList.remove('dragging'); }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  goal.dist = clamp(goal.dist * Math.exp(e.deltaY * 0.0012), 14, 160);
}, { passive: false });
function pan(dx, dy) {
  const scale = cur.dist * 0.0011;
  const sin = Math.sin(cur.theta), cos = Math.cos(cur.theta);
  goal.tx = clamp(goal.tx - (dx * cos) * scale + (dy * sin) * scale * 0.6, -35, 35);
  goal.tz = clamp(goal.tz + (dx * sin) * scale + (dy * cos) * scale * 0.6, -35, 35);
  goal.ty = clamp(goal.ty + dy * scale * 0.8, -14, 30);
}
function updateCamera(dt) {
  if (autoRotate && !dragging) goal.theta += dt * 0.05;
  const k = 1 - Math.exp(-8 * dt);
  for (const key of ['theta', 'phi', 'dist', 'tx', 'ty', 'tz']) cur[key] += (goal[key] - cur[key]) * k;
  const comp = innerWidth < 760 ? clamp(0.95 / (innerWidth / innerHeight), 1, 2.2) : 1;
  const dist = cur.dist * comp;
  const sp = Math.sin(cur.phi), cp = Math.cos(cur.phi);
  camera.position.set(
    cur.tx + dist * sp * Math.sin(cur.theta),
    cur.ty + dist * cp,
    cur.tz + dist * sp * Math.cos(cur.theta)
  );
  camera.lookAt(cur.tx, cur.ty, cur.tz);
}

/* ============ 面板绑定 ============ */
const $ = id => document.getElementById(id);
const state = { dragon: 0.7, petals: 220, sunaz: 35, sunint: 2.6, glow: 1, fog: 0.0028, vig: 0.55, quality: 1.25, auto: true, shadow: true };
const DEF = { ...state };
function applyState() {
  setSun(state.sunaz, state.sunint);
  scene.fog.density = state.fog;
  $('vignette').style.opacity = state.vig;
  glowMat.emissiveIntensity = 2.2 * state.glow;
  for (const pl of lanternLights) pl.intensity = (pl.distance > 11 ? 7 : 6) * state.glow;
  for (const sp of glowSprites) sp.material.opacity = 0.7 * state.glow;
  renderer.setPixelRatio(Math.min(devicePixelRatio, state.quality));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = state.shadow;
  staticMesh.castShadow = state.shadow; staticMesh.receiveShadow = state.shadow;
  sun.castShadow = state.shadow;
  autoRotate = state.auto;
}
function bindRange(id, key, fmt) {
  const el = $('c-' + id), out = $('o-' + id);
  el.addEventListener('input', () => {
    state[key] = parseFloat(el.value);
    out.textContent = fmt(state[key]);
    applyState();
  });
}
bindRange('dragon', 'dragon', v => v.toFixed(2));
bindRange('petals', 'petals', v => v.toFixed(0));
bindRange('sunaz', 'sunaz', v => v.toFixed(0) + '°');
bindRange('sunint', 'sunint', v => v.toFixed(1));
bindRange('glow', 'glow', v => v.toFixed(2));
bindRange('fog', 'fog', v => v.toFixed(4));
bindRange('vig', 'vig', v => v.toFixed(2));
$('c-quality').addEventListener('change', e => { state.quality = parseFloat(e.target.value); applyState(); });
$('c-auto').addEventListener('change', e => { state.auto = e.target.checked; applyState(); });
$('c-shadow').addEventListener('change', e => { state.shadow = e.target.checked; applyState(); });
function syncUI() {
  $('c-dragon').value = state.dragon; $('o-dragon').textContent = state.dragon.toFixed(2);
  $('c-petals').value = state.petals; $('o-petals').textContent = state.petals.toFixed(0);
  $('c-sunaz').value = state.sunaz; $('o-sunaz').textContent = state.sunaz.toFixed(0) + '°';
  $('c-sunint').value = state.sunint; $('o-sunint').textContent = state.sunint.toFixed(1);
  $('c-glow').value = state.glow; $('o-glow').textContent = state.glow.toFixed(2);
  $('c-fog').value = state.fog; $('o-fog').textContent = state.fog.toFixed(4);
  $('c-vig').value = state.vig; $('o-vig').textContent = state.vig.toFixed(2);
  $('c-quality').value = String(state.quality);
  $('c-auto').checked = state.auto; $('c-shadow').checked = state.shadow;
}
$('b-reset').addEventListener('click', () => {
  Object.assign(state, DEF); Object.assign(goal, INIT);
  syncUI(); applyState();
});
$('b-random').addEventListener('click', () => {
  dragonT += rr(20, 200);
  windX = rr(-0.6, 0.6); windZ = rr(-0.4, 0.4);
  for (const p of petals) p.live = false;
  for (const b of butterflies) b.ph = rr(0, 9);
  for (const s of shards) s.a = rr(0, 9);
  state.sunaz = Math.floor(rr(0, 360));
  syncUI(); applyState();
});
$('b-shot').addEventListener('click', () => {
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.download = '浮空御园-盘龙.png';
  a.href = renderer.domElement.toDataURL('image/png');
  a.click();
});
function applyViewOffset() {
  const narrow = innerWidth < 760;
  camera.fov = narrow ? 55 : 45;
  if (narrow) camera.setViewOffset(innerWidth, innerHeight, 98, 0, innerWidth, innerHeight);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  applyViewOffset();
  renderer.setSize(innerWidth, innerHeight);
});
applyViewOffset();

/* ============ 主循环 ============ */
$('st-vox').textContent = (SV.length + EV.length + DRAGON_N * 5 + PETAL_CAP + 80 + 18 + 14 + 16).toLocaleString();
applyState(); syncUI();
const clock = new THREE.Clock();
let frames = 0, fpsT = 0, started = false, __frameCount = 0;
window.__garden = {
  get cameraPos() { return camera.position.toArray(); },
  get dist() { return cur.dist; },
  get state() { return { ...state }; },
  get dragonT() { return dragonT; },
  get petalCount() { return petalMesh.count; },
  get voxCount() { return SV.length + EV.length; },
  get sunPos() { return sun.position.toArray(); },
  get frameCount() { return __frameCount; },
  get drawCalls() { return renderer.info.render.calls; }
};
function loop() {
  requestAnimationFrame(loop);
  __frameCount++;
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;
  dragonT += dt * state.dragon;
  updateDragon(t);
  updatePetals(t, dt, state.petals);
  updateWater(t, dt);
  updateKoi(t);
  updateButterflies(t);
  updateCranes(t);
  const flick = 1 + Math.sin(t * 9.7) * 0.04 + Math.sin(t * 23.3) * 0.03;
  glowMat.emissiveIntensity = 2.2 * state.glow * flick;
  updateCamera(dt);
  renderer.render(scene, camera);
  frames++; fpsT += dt;
  if (fpsT >= 1) { $('st-fps').textContent = Math.round(frames / fpsT); frames = 0; fpsT = 0; }
  if (!started) {
    started = true;
    setTimeout(() => document.getElementById('loading').classList.add('gone'), 250);
  }
}
loop();
</script>
